name: luckynote
description: "LuckyNote - 本地优先的个人知识库与 AI 助手"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 编辑器核心
  super_editor: ^0.3.0-dev.47

  # 文件系统
  file_selector: ^1.0.3
  shared_preferences: ^2.2.3
  path: ^1.9.0
  path_provider: ^2.1.4
  watcher: ^1.1.0

  # 本地数据库 - Drift (SQLite with FTS5)
  drift: ^2.21.0
  sqlite3: ^2.4.6
  sqflite_common_ffi: ^2.3.3

  # UI 组件
  lucide_icons: ^0.257.0
  flutter_split_view: ^0.1.2

  # 路由
  go_router: ^14.2.0

  # AI & 网络
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  flutter_markdown: ^0.7.0

  # 工具
  uuid: ^4.4.0
  intl: ^0.19.0
  crypto: ^3.0.3
  markdown: ^7.2.2

  # LaTeX 数学公式渲染
  flutter_math_fork: ^0.7.2

  # 代码块语法高亮
  flutter_highlight: ^0.7.0

  # 剪贴板图片支持
  pasteboard: ^0.4.0

dev_dependencies:
  image: ^4.1.7
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  drift_dev: ^2.21.0

flutter:
  uses-material-design: true
